flutter_launcher_icons:
  image_path: assets/icon/icon_rounded.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F10"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  image_path_ios: assets/icon/icon_full.png
  remove_alpha_ios: true
  background_color_ios: "#0F0F10"
  web:
    generate: true
    image_path: assets/icon/icon_rounded.png
    background_color: "#0F0F10"
    theme_color: "#0F0F10"
  windows:
    generate: true
    image_path: assets/icon/icon_rounded.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon_macos.png
