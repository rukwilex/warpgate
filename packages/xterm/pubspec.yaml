name: xterm
description: Warpgate's copy of xterm.dart 4.0.0 (MIT, TerminalStudio) with compact scrollback, a shared bounded glyph cache and line recycling.
version: 4.0.0+warpgate.1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  convert: ^3.0.0
  equatable: ^2.0.3
  flutter:
    sdk: flutter
  meta: ^1.3.0
  quiver: ^3.0.0
  zmodem: ^0.0.6
