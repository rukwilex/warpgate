name: warpgate
description: An SSH and SFTP workbench for people who run many servers at once.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  cryptography: ^2.9.0
  dartssh2: ^4.1.0
  desktop_drop: ^0.8.4
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_pty: ^0.4.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  sqlite3: ^3.8.0
  uuid: ^4.6.0
  window_manager: ^0.5.1
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
